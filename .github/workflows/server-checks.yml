name: Server checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/preflight.py --server
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-test-password
          POSTGRES_DB: acr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/test_postgres.py
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-test-password@localhost:5432/acr_test
  portable-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build provider-independent server image
        run: docker build -t acr-rally-club:0.2.14 -f deploy/Dockerfile .
      - name: Generate disposable hosting settings
        run: |
          docker run --rm --mount type=bind,source="$PWD/deploy",target=/configuration acr-rally-club:0.2.14 python deploy/configure_hosting.py --domain league.example.com --download-url https://github.com/example/club/releases/download/v0.2/setup.exe --output /configuration/.env > /tmp/acr-ci-access.txt
          sudo chown "$(id -u):$(id -g)" deploy/.env
      - name: Validate Compose and Caddy authentication configuration
        run: |
          docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
          docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check PostgreSQL driver in the portable image
        run: docker run --rm acr-rally-club:0.2.14 python -c "import psycopg, psycopg_pool; print('PostgreSQL drivers available')"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/browser_smoke.py
