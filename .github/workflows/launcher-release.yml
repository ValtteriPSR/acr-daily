# Release archives must include verified participant translations.
name: Publish Windows launcher
on:
  push:
    branches: ['rally-club']
    paths: ['VERSION', '.github/workflows/launcher-release.yml']
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      public_url:
        description: 'Public HTTPS club URL (without a trailing path)'
        required: true
        type: string
      release_tag:
        description: 'New release tag, for example v0.2.4 or v0.2.4-custom-domain'
        required: true
        type: string
concurrency:
  group: windows-launcher-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure release domain
        shell: pwsh
        env:
          PUBLIC_URL: ${{ inputs.public_url || vars.ACR_CLUB_PUBLIC_URL }}
        run: |
          if (-not $env:PUBLIC_URL) {
            $manifest = Get-Content RELEASE-MANIFEST.json -Raw | ConvertFrom-Json
            $env:PUBLIC_URL = $manifest.public_url
          }
          if (-not $env:PUBLIC_URL) { throw 'Set ACR_CLUB_PUBLIC_URL or the release manifest public_url' }
          python tools/configure_public_launcher.py --url "$env:PUBLIC_URL"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid public launcher URL' }
          "PUBLIC_URL=$env:PUBLIC_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Windows packaging dependencies
        run: python -m pip install --upgrade pyinstaller
      - name: Download and verify ACR Daily client modules (pinned commit)
        run: python tools/vendor_acr_daily.py --download
      - name: Verify upstream modules
        run: python tools/vendor_acr_daily.py --check
      - name: Verify all launcher module imports before freezing
        run: python tools/verify_launcher_modules.py
      - name: Export car catalog from original ACR Daily
        run: python tools/export_club_catalog.py
      - name: Build executable setup (also launches protocol)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name ACR-Rally-Club-Setup --paths client `
            --collect-submodules acr_daily --hidden-import acr_daily.settings `
            --add-data "client/club_local/catalog.json;club_local" `
            client/run_web_launcher.py
      - name: Smoke-test frozen launcher imports
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/ACR-Rally-Club-Setup.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen EXE import self-test failed with exit code $($process.ExitCode)" }
      - name: SHA256 checksum
        shell: pwsh
        run: |
          (Get-FileHash 'dist/ACR-Rally-Club-Setup.exe' -Algorithm SHA256).Hash.ToLower() + '  ACR-Rally-Club-Setup.exe' | Out-File -Encoding ascii 'dist/ACR-Rally-Club-Setup.exe.sha256'
      - name: Portable source archive and release metadata
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content VERSION -Raw).Trim()
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $archive = "ACR-Rally-Club-$releaseVersion-Source.zip"
          git archive --format=zip --output="dist/$archive" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower() + "  $archive" | Out-File -Encoding ascii "dist/$archive.sha256"
          $metadata = @{
            version = $releaseVersion
            launcher_version = (python -c "import sys; sys.path.insert(0,'client'); from club_local.version import VERSION; print(VERSION)")
            source_commit = '${{ github.sha }}'
            public_url = $env:PUBLIC_URL
            exe_sha256 = (Get-FileHash 'dist/ACR-Rally-Club-Setup.exe' -Algorithm SHA256).Hash.ToLower()
            source_archive_sha256 = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          }
          $metadata | ConvertTo-Json | Out-File -Encoding utf8 'dist/release-metadata.json'
      - name: Test built artifact is present
        shell: pwsh
        run: |
          if ((Get-Item 'dist/ACR-Rally-Club-Setup.exe').Length -lt 1000000) { throw 'Installer missing/implausibly small' }
      - uses: actions/upload-artifact@v4
        with:
          name: ACR-Rally-Club-Setup-Windows
          path: |
            dist/ACR-Rally-Club-Setup.exe
            dist/ACR-Rally-Club-Setup.exe.sha256
            dist/*-Source.zip
            dist/*-Source.zip.sha256
            dist/release-metadata.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('v{0}', env.RELEASE_VERSION) }}
          target_commitish: ${{ github.sha }}
          name: ACR Rally Club ${{ env.RELEASE_VERSION }}
          make_latest: true
          files: |
            dist/ACR-Rally-Club-Setup.exe
            dist/ACR-Rally-Club-Setup.exe.sha256
            dist/*-Source.zip
            dist/*-Source.zip.sha256
            dist/release-metadata.json
          body_path: docs/RELEASE-NOTES.md
          generate_release_notes: true
